[package]
name = "ez-hash"
version = "1.1.0"
edition = "2021"

description = "Ergonomic hashing helpers with a simple Hashable API and optional algorithm features."
license = "Apache-2.0"
readme = "README.md"

repository = "https://github.com/kvinwang/ez-hash"
homepage = "https://github.com/kvinwang/ez-hash"
documentation = "https://docs.rs/ez-hash"

keywords = ["hash", "sha2", "sha3", "keccak", "blake"]
categories = ["cryptography"]

[features]
default = ["sha1", "sha2", "sha3", "md5", "blake2", "blake3"]
sha1 = ["dep:sha1"]
sha2 = ["dep:sha2"]
sha3 = ["dep:sha3"]
md5 = ["dep:md-5"]
blake2 = ["dep:blake2"]
blake3 = ["dep:blake3"]

[dependencies]
digest = "0.10"
sha2 = { version = "0.10", optional = true }
sha1 = { version = "0.10", optional = true }
sha3 = { version = "0.10", optional = true }
md-5 = { version = "0.10", optional = true }
blake2 = { version = "0.10", optional = true }
blake3 = { version = "1.5", optional = true }

[dev-dependencies]
hex-literal = "1.1.0"
